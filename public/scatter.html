<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Python 주가 추이 차트</title>
  <link rel="stylesheet" href="./vendor/apexcharts/dist/apexcharts.css" />
  <script src="./vendor/apexcharts/dist/apexcharts.js"></script>
</head>
<body>
  <h2 style="text-align:center;">📈 Python 백엔드 주가 추이 차트</h2>
  <div id="chart"></div>

  <script>
    fetch("http://localhost:8000/api/stocks")
      .then((res) => res.json())
      .then((json) => {
        const series = json.stocks.map((stock) => ({
          name: stock.name,
          data: stock.close
        }));

        const options = {
          chart: {
            type: "line",
            height: 420
          },
          series,
          xaxis: {
            categories: json.dates,
            title: { text: "거래일" }
          },
          yaxis: {
            title: { text: "종가 (KRW)" },
            labels: {
              formatter: (value) => Number(value).toLocaleString()
            }
          },
          tooltip: {
            y: {
              formatter: (value) => `${Number(value).toLocaleString()}원`
            }
          },
          colors: ["#2563EB", "#10B981", "#F97316", "#EF4444"]
        };

        new ApexCharts(document.querySelector("#chart"), options).render();
      })
      .catch((err) => {
        console.error("데이터 로드 실패:", err);
        document.getElementById("chart").innerHTML =
          "<p style='color:red; text-align:center'>Python 백엔드에서 주가 데이터를 불러오지 못했습니다.</p>";
      });
  </script>
</body>
</html>
